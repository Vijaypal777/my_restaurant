{% extends "base.html" %}
{% load static %}
{% block class %}class="sub_page"{% endblock  %}

{% block main %}
<!-- book section -->
<section class="book_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Book A Table
        </h2>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <!-- Update the form action to point to the BookTable view and set the method to POST -->
            <form action="{% url 'Book_Table' %}" method="POST">
              {% csrf_token %}
              <div>
                <input type="text" class="form-control" name="name" placeholder="Your Name" required />
              </div>
              <div>
                <input type="text" class="form-control" name="phone_number" placeholder="Phone Number" required />
              </div>
              <div>
                <input type="email" class="form-control" name="email" placeholder="Your Email" required />
              </div>
              <div>
                <select class="form-control nice-select wide" name="total_person" required>
                  <option value="" disabled selected>How many persons?</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div>
                <input type="date" class="form-control" name="booking_date" required />
              </div>
              <div class="btn_box">
                <button type="submit">
                  Book Now
                </button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="map_container">
            <div id="googleMap"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end book section -->
{% endblock %}
